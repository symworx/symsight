[project]
name = "symsight"
dynamic = ["version"]
description = "Insight generator: articles and social posts with CLI and TUI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
authors = [
    { name = "Nathaniel T. Berry" },
]
keywords = [
    "content-generation",
    "cli",
    "tui",
    "brand",
    "writing",
    "xai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "textual>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.10",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-mock>=3.10",
]

[project.scripts]
symsight = "symsight.cli:main"

[project.urls]
Homepage = "https://github.com/symworx/symsight"
Repository = "https://github.com/symworx/symsight"
Issues = "https://github.com/symworx/symsight/issues"
Changelog = "https://github.com/symworx/symsight/blob/main/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/symsight-py/Cargo.toml"
python-source = "src"
module-name = "symsight._native"
features = ["pyo3/extension-module"]
include = [
    "config/**/*",
    "examples/**/*",
    "scripts/**/*",
    "tests/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "unit",
    "integration",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "*.egg-info",
]

[tool.ruff.lint]
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"
