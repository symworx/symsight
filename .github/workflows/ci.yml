# Day-to-day CI for symsight (Python / uv + Rust workspace).
#
# GitHub Flow (same as SymWorx / SymKit):
#   feature/* ──PR──► worx ──tag──► vX.Y.Z
# develop stays in the filter until GitHub renames develop → worx.
# Tag / release.yml re-runs the full gate before publish.
# workflow_dispatch re-runs this gate (checks only; no publish).
#
# Job ids match family default-branch required checks (no `name:` so GitHub
# reports fmt / rust-checks / python-bindings).

name: CI

on:
  push:
    branches: [worx, develop]
  pull_request:
    branches: [worx, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install nightly Rust (rustfmt)
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: rustfmt

      - name: rustfmt
        run: cargo +nightly fmt --all -- --check

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: version lockstep
        run: ./scripts/bump-version.sh

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv python install 3.11
          uv python install 3.12

      - name: Ruff
        run: |
          uv sync --extra dev --python 3.12
          uv run --python 3.12 ruff check src tests

      - name: Pytest (3.11)
        run: |
          uv sync --extra test --python 3.11
          uv run --python 3.11 pytest

      - name: Pytest (3.12)
        run: |
          uv sync --extra test --python 3.12
          uv run --python 3.12 pytest
